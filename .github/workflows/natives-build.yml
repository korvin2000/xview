# Builds the natives that have no prebuilt upstream source (docs/NATIVES.md §2, PLAN P7.7): today the libjxl JNI wrapper
# `libjxl_jni.dylib` for macOS x86_64 and arm64 (Homebrew/MacPorts build libjxl with JNI off; upstream ships jxl_jni only
# for Windows). Same recipe as upstream's static Windows release: libjxl v0.12.0, BUILD_SHARED_LIBS=OFF, target jxl_jni,
# so the dylib depends only on libSystem/libc++. Decoding runs on the same code path as Windows (~1 s for 42 MP).
#
# Manual steps after a run: download the artifact, add the two files to the natives-<rev> release as
# `libjxl_jni-macos-x86_64.dylib` / `libjxl_jni-macos-aarch64.dylib`, add a `libjxl_jni.dylib` row (member `-`, the
# printed SHA-256 and size) to natives/macos-x86_64.tsv and natives/macos-aarch64.tsv, rebundle (tools/natives/bundle.sh),
# upload the new macOS bundles and update xview.natives.sha256 in the parent pom.
name: natives-build
on:
  workflow_dispatch:
    inputs:
      libjxl_ref:
        description: libjxl tag to build
        required: true
        default: v0.12.0
      macos_min:
        description: minimum macOS version (x86_64 builds use 10.13 if lower)
        required: true
        default: '11.0'

jobs:
  jxl-jni-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, arch: x86_64, platform: macos-x86_64 }
          - { os: macos-14, arch: arm64, platform: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Tools
        run: brew install cmake ninja llvm || true
      - name: Clone libjxl ${{ inputs.libjxl_ref }}
        run: git clone --depth 1 --recursive --branch "${{ inputs.libjxl_ref }}" https://github.com/libjxl/libjxl.git libjxl
      - name: Configure and build jxl_jni
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          MIN="${{ inputs.macos_min }}"; [ "${{ matrix.arch }}" = x86_64 ] && MIN="10.13"
          cmake -S libjxl -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MIN" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF \
            -DJPEGXL_ENABLE_JNI=ON \
            -DJPEGXL_FORCE_SYSTEM_BROTLI=OFF -DJPEGXL_FORCE_SYSTEM_HWY=OFF \
            -DJPEGXL_ENABLE_SKCMS=ON \
            -DJPEGXL_ENABLE_TOOLS=OFF -DJPEGXL_ENABLE_BENCHMARK=OFF -DJPEGXL_ENABLE_EXAMPLES=OFF \
            -DJPEGXL_ENABLE_DOXYGEN=OFF -DJPEGXL_ENABLE_MANPAGES=OFF -DJPEGXL_ENABLE_SJPEG=OFF -DJPEGXL_ENABLE_OPENEXR=OFF
          cmake --build build --target jxl_jni --parallel
      - name: Collect, sign and inspect
        run: |
          mkdir -p out/libs/macos/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
          f="$(find build -name 'libjxl_jni.dylib' | head -1)"; test -n "$f"
          cp "$f" out/libjxl_jni-${{ matrix.platform }}.dylib
          strip -x out/libjxl_jni-${{ matrix.platform }}.dylib
          codesign --force --sign - out/libjxl_jni-${{ matrix.platform }}.dylib
          codesign --verify --verbose out/libjxl_jni-${{ matrix.platform }}.dylib
          echo "== dependencies"; otool -L out/libjxl_jni-${{ matrix.platform }}.dylib
          echo "== minos";        otool -l out/libjxl_jni-${{ matrix.platform }}.dylib | grep -A3 LC_BUILD_VERSION | grep -E 'minos|sdk'
          echo "== JNI exports"; nm -gU out/libjxl_jni-${{ matrix.platform }}.dylib | grep Java_ || true
          echo "== sha256 / size"; shasum -a 256 out/libjxl_jni-${{ matrix.platform }}.dylib; stat -f %z out/libjxl_jni-${{ matrix.platform }}.dylib
          # self-containment: only system libraries may be referenced
          ! otool -L out/libjxl_jni-${{ matrix.platform }}.dylib | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)'
      - uses: actions/upload-artifact@v4
        with:
          name: libjxl_jni-${{ matrix.platform }}
          path: out/libjxl_jni-${{ matrix.platform }}.dylib
          if-no-files-found: error
